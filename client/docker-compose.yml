version: '3.8'

services:
  liquid-ai:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - liquid-data:/app/sqlite.db
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=3000
    restart: always

volumes:
  liquid-data:
